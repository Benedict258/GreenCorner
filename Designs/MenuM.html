<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet" data-dc-tpl="1">
<style>
:root{--color-text:#17231c;--color-muted-strong:#4a574f;--color-border:#d8dad5;--color-primary:#0c5c2e;--color-forest:#0c4a23;--color-primary-soft:#e7f4eb;--font-head:'Manrope',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif}
body{margin:0}
.sheet{width:100%;max-width:360px;height:800px;display:flex;flex-direction:column;background:#fff;color:var(--color-text);font-family:var(--font-body);font-size:16px;line-height:1.5}
.sheet *,.sheet *::before,.sheet *::after{box-sizing:border-box}
.sheet :is(ul,p){margin:0}
.sheet a:focus-visible,.sheet button:focus-visible{outline:2px solid var(--color-text);outline-offset:2px}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sheet__head{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 12px 16px;border-bottom:1px solid var(--color-border)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--color-text);font:800 20px/1 var(--font-head);letter-spacing:-.02em}
.logo b{color:var(--color-primary)}
.logo svg{width:32px;height:32px;color:var(--color-primary)}
.close{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--color-text)}
.close:hover{background:var(--color-primary-soft)}
.sheet__nav{list-style:none;padding:8px 16px;display:flex;flex-direction:column}
.sheet__nav a{display:flex;align-items:center;justify-content:space-between;min-height:56px;font:700 20px var(--font-head);letter-spacing:-.02em;color:var(--color-text);text-decoration:none;border-bottom:1px solid #edefe9}
.sheet__nav a:hover{color:var(--color-primary)}
.sheet__nav a[aria-current="page"]{color:var(--color-primary)}
.sheet__more{list-style:none;padding:8px 16px;margin-top:8px;display:flex;flex-direction:column;gap:2px}
.sheet__more a{display:flex;align-items:center;gap:12px;min-height:48px;color:var(--color-text);text-decoration:none;font-weight:500}
.sheet__more a:hover{color:var(--color-primary)}
.sheet__foot{margin-top:auto;padding:16px;border-top:1px solid var(--color-border);display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:999px;border:1.5px solid transparent;font:600 15px var(--font-body);text-decoration:none}
.btn--primary{background:var(--color-primary);color:#fff}
.btn--secondary{background:#fff;border-color:var(--color-primary);color:var(--color-primary)}
.component{position:relative;height:auto}
#root,#root>.component{height:auto}
</style>
</head>
<body>

<div id="root"><div class="component"><div class="sheet" role="dialog" aria-label="Menu"><div class="sheet__head"><a class="logo" href="index.html" aria-label="Waste2Light Store, home"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="15" r="9"></circle><path d="M13 27h8M14.5 30h5"></path><path d="M12 15c0-3 2-5 5-5 0 3-2 5-5 5zM17 15v6"></path></svg>Waste<b>2</b>Light</a><button class="close" type="button" aria-label="Close menu"><svg class="icon" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div><ul class="sheet__nav"><li><a href="Shop.html">Shop<svg class="icon" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a></li><li><a href="Projects.html">Projects<svg class="icon" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a></li><li><a href="index.html#schools">For schools<svg class="icon" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a></li><li><a href="About.html">About<svg class="icon" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a></li><li><a href="Contact.html">Contact<svg class="icon" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a></li></ul><ul class="sheet__more"><li><a href="Track.html"><svg class="icon" aria-hidden="true"><path d="M3 6h11v10H3zM14 9.5h4l3 3.5v3h-7"></path><circle cx="7" cy="18" r="1.8"></circle><circle cx="17" cy="18" r="1.8"></circle></svg>Track order</a></li><li><a href="https://wa.me/2348078787646"><svg class="icon" aria-hidden="true"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.3 18.7z"></path><path d="M9.2 9.2c.2 2.4 2.4 4.6 5 5.5l1-1.3-1.7-.9-.8.6c-.9-.4-1.7-1.2-2.1-2.1l.6-.8-.9-1.7z"></path></svg>WhatsApp us</a></li></ul><div class="sheet__foot"><a class="btn btn--primary" href="AccountOrders.html">Sign in</a><a class="btn btn--secondary" href="Quote.html">Request a quote</a></div></div></div></div>




</body>
</html>
