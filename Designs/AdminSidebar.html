<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin sidebar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet" data-dc-tpl="1">
<style>
:root{--color-text:#17231c;--color-primary:#0c5c2e;--color-forest:#0c4a23;--color-leaf:#35a65a;--color-sun:#f6c453;--color-primary-soft:#e7f4eb;--color-border:#d8dad5;--font-head:'Manrope',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif}
body{margin:0}
.side{width:240px;min-height:100vh;display:flex;flex-direction:column;gap:20px;padding:20px 12px;background:var(--color-forest);color:#fff;font-family:var(--font-body)}
.side *,.side *::before,.side *::after{box-sizing:border-box}
.side :is(ul,p){margin:0}
.side a:focus-visible,.side button:focus-visible,.tabbar a:focus-visible{outline:2px solid var(--color-sun);outline-offset:2px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px;text-decoration:none;color:#fff}
.brand svg{width:30px;height:30px;color:var(--color-sun)}
.brand__word{font:800 18px/1 var(--font-head);letter-spacing:-.02em}
.brand__word b{color:var(--color-sun)}
.brand__tag{display:block;margin-top:3px;font:600 10px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:#c9dccf}
.nav{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.nav__group{margin:14px 10px 4px;font:700 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:#a9c4b1}
.nav__link{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:#e3efe6;text-decoration:none;font:500 14.5px var(--font-body)}
.nav__link:hover{background:rgba(255,255,255,.1);color:#fff}
.nav__link--on{background:#fff;color:var(--color-forest);font-weight:700}
.nav__count{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--color-sun);color:var(--color-text);font:700 12px/22px var(--font-body);text-align:center}
.collapse{margin-top:auto;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:#e3efe6;font:500 14px var(--font-body);cursor:pointer}
.collapse:hover{background:rgba(255,255,255,.16)}
.tabbar{display:none}
@media(max-width:900px){
.side{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--color-border);box-shadow:0 -6px 20px rgba(23,35,28,.1);font-family:var(--font-body)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;color:#3d4942;text-decoration:none;font:600 12px var(--font-body);position:relative}
.tabbar a[aria-current="page"]{color:var(--color-primary)}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--color-primary)}
.tabbar .icon{width:22px;height:22px}
}
.component{position:relative;height:auto}
#root,#root>.component{height:auto}
</style>
</head>
<body>

den="true"><use href="#a-customers"></use></svg><span class="sc-interp">Customers</span></a></li><li><a class="nav__link" href="AdminDashboard.html"><svg class="icon" aria-hidden="true"><use href="#a-sync"></use></svg><span class="sc-interp">Sync</span></a></li><li><a class="nav__link" href="AdminDashboard.html"><svg class="icon" aria-hidden="true"><use href="#a-settings"></use></svg><span class="sc-interp">Settings</span></a></li><li><a class="nav__link" href="AdminDashboard.html"><svg class="icon" aria-hidden="true"><use href="#a-staff"></use></svg><span class="sc-interp">Staff</span></a></li><li><a class="nav__link" href="AdminDashboard.html"><svg class="icon" aria-hidden="true"><use href="#a-activity"></use></svg><span class="sc-interp">Activity</span></a></li></ul></nav><button class="collapse" type="button"><svg class="icon" aria-hidden="true"><use href="#a-collapse"></use></svg>Collapse menu</button></aside><nav class="tabbar" aria-label="Admin quick navigation"><a href="AdminDashboard.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#a-dash"></use></svg>Dashboard</a><a href="AdminOrders.html"><svg class="icon" aria-hidden="true"><use href="#a-orders"></use></svg>Orders</a><a href="AdminQuote.html"><svg class="icon" aria-hidden="true"><use href="#a-quotes"></use></svg>Quotes</a><a href="AdminProducts.html"><svg class="icon" aria-hidden="true"><use href="#a-more"></use></svg>More</a></nav></div></div></div>
